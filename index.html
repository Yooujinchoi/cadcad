<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f10">
<title>울의 카드게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css?v=52">
</head>
<body>
<main id="app">

  <section id="s-auth" class="screen center">
    <h1 class="logo">인물<br>카드전</h1>
    <form id="auth-form" class="form">
      <div class="tabs"><button type="button" id="t-in" class="on">로그인</button><button type="button" id="t-up">회원가입</button></div>
      <input class="fld" id="uid" placeholder="아이디 (영문·숫자·_ 4~12자)" maxlength="12" autocapitalize="off" autocomplete="username">
      <input class="fld" id="upw" type="password" placeholder="비밀번호 (6자 이상)" autocomplete="current-password">
      <input class="fld" id="upw2" type="password" placeholder="비밀번호 확인" autocomplete="new-password" hidden>
      <p class="err-msg" id="aerr"></p>
      <button class="btn" id="abtn" type="submit">로그인</button>
    </form>
  </section>

  <section id="s-name" class="screen center" hidden>
    <h1 class="logo">인물<br>카드전</h1>
    <form id="name-form" class="form" autocomplete="off">
      <label for="name">당신의 이름을 설정하세요</label>
      <input class="fld" id="name" maxlength="13" placeholder="닉네임 (최대 13글자)" enterkeyhint="done">
      <div class="count"><span id="cnt">0</span>/13</div>
      <button class="btn" type="submit">확인</button>
    </form>
  </section>

  <section id="s-menu" class="screen" hidden>
    <header class="top"><button class="me" id="m-me" type="button" aria-label="프로필"><span id="m-av"></span><b id="m-name"></b></button><span id="m-wal"></span></header>
    <div class="menu">
      <button class="mbtn big" id="m-ai">AI랑 맞짱 까기</button>
      <button class="mbtn big" id="m-multi">멀티 게임</button>
      <button class="mbtn big" id="m-deck">출격 카드 설정</button>
      <button class="mbtn big" id="m-shop">상점</button>
    </div>
    <div class="row"><button class="mbtn" id="m-coll">컬렉션</button><button class="mbtn" id="m-gacha">뽑기하러가기</button></div>
    <div class="foot"><button class="link" id="m-patch">패치 내역<span class="dot" id="m-dot" hidden></span></button><button class="link" id="m-out">로그아웃</button></div>
  </section>

  <section id="s-shop" class="screen" hidden>
    <header class="bar"><button class="back" data-go="menu" aria-label="뒤로">‹</button><h2>상점</h2></header>
    <p class="sub" id="sh-wal"></p>
    <div class="shoplist" id="sh-list"></div>
  </section>

  <section id="s-patch" class="screen" hidden>
    <header class="bar"><button class="back" data-go="menu" aria-label="뒤로">‹</button><h2>패치 내역</h2></header>
    <div class="patches" id="patch-list"></div>
  </section>

  <section id="s-prof" class="screen" hidden>
    <header class="bar"><button class="back" data-go="menu" aria-label="뒤로">‹</button><h2>프로필</h2></header>
    <div class="prof"><div id="pf-av"></div><b id="pf-name"></b></div>
    <input type="file" id="pf-file" accept="image/*" hidden>
    <button class="btn" id="pf-up" type="button">사진 올리기</button>
    <button class="btn ghost" id="pf-del" type="button">기본 사진으로</button>
    <button class="btn ghost" id="pf-rn" type="button"></button>
  </section>

  <section id="s-diff" class="screen" hidden>
    <header class="bar"><button class="back" data-go="menu" aria-label="뒤로">‹</button><h2>난이도 선택</h2></header>
    <div class="menu" id="diff-list"></div>
  </section>

  <section id="s-coll" class="screen" hidden>
    <header class="bar"><button class="back" data-go="menu" aria-label="뒤로">‹</button><h2>컬렉션</h2><span id="coll-cnt"></span></header>
    <div class="grid" id="coll-grid"></div>
  </section>

  <section id="s-deck" class="screen" hidden>
    <header class="bar"><button class="back" data-go="menu" aria-label="뒤로">‹</button><h2>출격 카드 설정</h2><span id="deck-cnt"></span></header>
    <p class="sub">아래 카드를 누르면 칸에 들어가고, 칸을 누르면 빠져요. 1번 칸 카드가 먼저 나가요.</p>
    <div class="slots5" id="deck-slots"></div>
    <div class="grid" id="deck-grid"></div>
  </section>

  <section id="s-gacha" class="screen" hidden>
    <header class="bar"><button class="back" data-go="menu" aria-label="뒤로">‹</button><h2>뽑기</h2><span id="g-wal"></span></header>
    <div class="packwrap"><div class="pack" id="pack"><span>카드팩</span></div></div>
    <p class="sub rate" id="g-rate"></p>
    <div class="tiers" id="g-tiers"></div>
    <div class="row">
      <button class="btn" id="g1">1회 뽑기<small>뽑기권 1장</small></button>
      <button class="btn" id="g10">10회 뽑기<small>뽑기권 10장</small></button>
    </div>
  </section>

  <section id="s-lobby" class="screen" hidden>
    <header class="bar"><button class="back" data-go="menu" aria-label="뒤로">‹</button><h2>멀티 게임</h2></header>
    <button class="btn" id="l-make" type="button">방 만들기</button>
    <p class="sub">참가할 방을 고르세요.</p>
    <div class="rooms" id="l-list"></div>
  </section>

  <section id="s-room" class="screen" hidden>
    <header class="bar"><h2 id="r-title"></h2></header>
    <div class="slots" id="r-slots"></div>
    <p class="sub" id="r-msg"></p>
    <button class="btn" id="r-start" type="button">게임 시작</button>
    <button class="btn ghost" id="r-leave" type="button">나가기</button>
  </section>

  <section id="s-game" class="screen" hidden>
    <header class="top"><b id="who"></b><span id="stg"></span><button class="quit" id="quit" hidden>나가기</button></header>
    <div class="enemy" id="enemy">
      <div class="bot" id="bot"><div class="face"><i></i><i></i></div><u></u><div id="bav" hidden></div></div>
      <div class="nm" id="bname"></div>
      <div class="hp"><div id="hpf"></div><div class="shbar" id="hps"></div><span id="hpt"></span></div>
      <div class="sp" id="bsp"><div id="bspf"></div><span id="bspt"></span></div>
    </div>
    <p class="hint" id="hint"></p>
    <div class="bench" id="bench"></div>
    <div class="hand">
      <div class="side"><button class="sk2" id="sk2btn" type="button" aria-label="두 번째 스킬" hidden>☠<b id="sk2c"></b></button></div>
      <div class="active" id="active">
        <button class="card" id="card" type="button" aria-label="카드 사용">
          <img id="cimg" src="kimul.jpg" alt="">
          <span class="skill"><span class="atk"><b id="n1"></b><em id="d1"></em></span><span class="atk sk" id="sk" hidden><b id="n2"></b><em id="d2"></em></span></span>
          <span class="cd" id="cd"></span><span class="charge"></span>
        </button>
        <div class="hp"><div id="chf"></div><div class="shbar" id="chs"></div><span id="cht"></span></div>
        <div class="sp" id="psp"><div id="pspf"></div><span id="pspt"></span></div>
      </div>
      <div class="side"><button class="shield" id="shield" type="button" aria-label="방어막"><svg viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5z"/></svg><b id="shn">3</b></button></div>
    </div>
  </section>

  <div class="over" id="over" hidden>
    <div class="panel">
      <h2 id="p-title"></h2>
      <img class="pimg" id="p-img" alt="" hidden>
      <p id="p-text"></p>
      <input class="fld" id="p-in" maxlength="20" autocomplete="off" hidden>
      <button class="btn" id="p-ok" type="button"></button>
      <button class="btn ghost" id="p-sub" type="button" hidden></button>
    </div>
  </div>

  <div class="res" id="res" hidden><div class="rgrid" id="rgrid"></div><button class="btn" id="r-ok" type="button">확인</button></div>
  <div id="toast" role="status"></div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="game.js?v=52"></script>
<script src="patches.js?v=33"></script>
<script src="app.js?v=51"></script>
<script src="multi.js?v=45"></script>
</body>
</html>
