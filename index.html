<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f10">
<title>울의 카드게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">

  <section id="s-name" class="screen center">
    <h1 class="logo">인물<br>카드전</h1>
    <form id="name-form" autocomplete="off">
      <label for="name">당신의 이름을 설정하세요</label>
      <input id="name" maxlength="8" placeholder="닉네임 (최대 8글자)" enterkeyhint="done">
      <div class="count"><span id="cnt">0</span>/8</div>
      <button class="btn" type="submit">확인</button>
    </form>
  </section>

  <section id="s-game" class="screen" hidden>
    <header class="top"><b id="who"></b><span id="stg"></span></header>

    <div class="enemy" id="enemy">
      <div class="bot" id="bot"><div class="face"><i></i><i></i></div><u></u></div>
      <div class="nm">대충 훈련봇</div>
      <div class="hp"><div id="hpf"></div><span id="hpt"></span></div>
      <div class="sp" id="bsp"><div id="bspf"></div></div>
    </div>

    <p class="hint" id="hint"></p>

    <div class="hand">
      <div class="side"><div class="mini" id="mini"><img src="kimul.jpg" alt="대기 카드"><div class="hp"><div id="mhf"></div></div></div></div>
      <div class="active" id="active">
        <button class="card" id="card" type="button" aria-label="평범한 김울 카드">
          <img src="kimul.jpg" alt="평범한 김울">
          <span class="skill"><span class="atk"><b id="n1"></b><em id="d1"></em></span><span class="atk sk" id="sk" hidden><b id="n2"></b><em id="d2"></em></span></span>
          <span class="cd" id="cd"></span><span class="charge"></span>
        </button>
        <div class="hp"><div id="chf"></div><span id="cht"></span></div>
        <div class="sp" id="psp"><div id="pspf"></div><span id="pspt"></span></div>
      </div>
      <div class="side"><button class="shield" id="shield" type="button" aria-label="방어막"><svg viewBox="0 0 24 24"><path d="M12 2l8 3v6c0 5-3.4 9.4-8 11-4.6-1.6-8-6-8-11V5z"/></svg><b id="shn">3</b></button></div>
    </div>
  </section>

  <div class="over" id="over" hidden>
    <div class="panel">
      <h2 id="p-title"></h2>
      <p id="p-text"></p>
      <button class="btn" id="p-ok" type="button"></button>
      <button class="btn ghost" id="p-sub" type="button" hidden></button>
    </div>
  </div>

</main>
<script src="game.js"></script>
</body>
</html>
